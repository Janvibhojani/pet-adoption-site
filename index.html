
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Tails - Pet Adoption</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <h1>Happy Tails Pet Adoption Center</h1>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#calculator">Care Cost Calculator</a></li>
        <li><a href="#contact">Adoption Inquiry</a></li>
      </ul>
    </nav>
  </header>

  <section id="home">
    <h2>Welcome to Happy Tails!</h2>
    <p>Your perfect companion is waiting for you. Adopt a pet today and make a difference!</p>
  </section>

  <section id="calculator">
    <h2>Pet Care Cost Calculator</h2>
    <label for="pet-type">Select a pet:</label>
    <select id="pet-type">
      <option value="dog">Dog</option>
      <option value="cat">Cat</option>
      <option value="rabbit">Rabbit</option>
    </select>
    <label for="months">Months of Care:</label>
    <input type="number" id="months" min="1" value="1" />
    <button onclick="calculateCost()">Calculate</button>
    <p id="result"></p>
  </section>

  <section id="contact">
    <h2>Adoption Inquiry Form</h2>
    <form action="https://formsubmit.co/Krulimbani499@gmail.com" method="POST">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://thankyou.example.com">

      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="pet">Type of Pet Interested In:</label>
      <input type="text" id="pet" name="pet" required />

      <label for="message">Why do you want to adopt?</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Happy Tails Pet Adoption Center</p>
  </footer>
</body>
</html>
